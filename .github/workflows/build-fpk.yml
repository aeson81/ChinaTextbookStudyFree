name: Build and Release FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 FFmpeg 媒体工具
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 3. 配置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          find . -name "requirements.txt" -exec pip install -r {} + || true

      # 4. 配置 Node.js 环境 (Node.js 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 5. 安装依赖并分步生成数据与构建 Next.js
      - name: Install dependencies and Build
        run: |
          npm install
          
          # 进入应用目录
          cd apps/web
          
          # 关键步骤1：生成课本与课文的 JSON 索引数据（供 generateStaticParams 读取）
          npx tsx scripts/build-data.ts
          
          # 关键步骤2：音频脚本处理（若缺失音源允许跳过，不阻碍构建）
          node ../../scripts/run-python.mjs ../../scripts/tts/web_audio.py || true
          
          # 关键步骤3：执行 Next.js 静态编译导出
          npx next build

      # 6. 组装 fpk 目录结构
      - name: Prepare FPK files
        run: |
          mkdir -p fpk_package
          
          # 复制静态网页产物
          if [ -d "apps/web/out" ]; then
            cp -r apps/web/out/* fpk_package/
          elif [ -d "out" ]; then
            cp -r out/* fpk_package/
          elif [ -d "dist" ]; then
            cp -r dist/* fpk_package/
          fi

          # 创建 manifest.json
          cat << 'EOF' > fpk_package/manifest.json
          {
            "id": "china-textbook-study",
            "name": "中国教材学习平台",
            "version": "${{ github.ref_name }}",
            "developer": "wuwangzhang1216",
            "description": "中小学电子教材与配套音资源学习平台",
            "arch": ["amd64", "arm64"],
            "icon": "icon.png",
            "main_port": 8080,
            "protocol": "http",
            "index_path": "/",
            "docker": {
              "compose_file": "docker-compose.yml"
            }
          }
          EOF

          # 创建 docker-compose.yml
          cat << 'EOF' > fpk_package/docker-compose.yml
          version: '3.8'
          services:
            web:
              image: nginx:alpine
              container_name: china-textbook-study
              restart: unless-stopped
              ports:
                - "${PORT:-8080}:80"
              volumes:
                - ./:/usr/share/nginx/html
          EOF

          # 复制图标
          if [ -f "public/favicon.ico" ]; then
            cp public/favicon.ico fpk_package/icon.png
          elif [ -f "apps/web/public/favicon.ico" ]; then
            cp apps/web/public/favicon.ico fpk_package/icon.png
          else
            touch fpk_package/icon.png
          fi

      # 7. 打包为 .fpk
      - name: Compress to .fpk
        run: |
          cd fpk_package
          tar -czvf ../china-textbook-study_${{ github.ref_name }}.fpk .

      # 8. 上传到 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: china-textbook-study_*.fpk
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
