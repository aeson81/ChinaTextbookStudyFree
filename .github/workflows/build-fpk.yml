name: Build and Release FPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装系统级媒体工具 FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 3. 配置 Python 环境并补齐音视频处理依赖
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydub requests tqdm mutagen pillow
          find . -name "requirements.txt" -exec pip install -r {} + || true

      # 4. 配置 Node.js 20 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 5. 一键完成依赖安装、数据生成与 Next.js 编译
      - name: Install dependencies and Build
        run: |
          # 安装全部工作区依赖
          npm install

          # 进入 Web 主程序目录
          cd apps/web

          # 关键点 1：精准执行 TypeScript 脚本生成教材与课文 JSON 数据
          npx tsx scripts/build-data.ts

          # 关键点 2：处理音频数据（即使缺音源也不中断后续编译）
          node ../../scripts/run-python.mjs ../../scripts/tts/web_audio.py || true

          # 关键点 3：执行 Next.js 静态 HTML 编译导出
          npx next build

      # 6. 校验编译产物并组装 FPK 目录结构
      - name: Prepare FPK files
        run: |
          # 校验静态页面是否成功生成
          if [ ! -d "apps/web/out" ]; then
            echo "Error: apps/web/out directory does not exist!"
            exit 1
          fi

          mkdir -p fpk_package
          
          # 复制导出的静态网页
          cp -r apps/web/out/* fpk_package/

          # 创建 manifest.json
          cat << 'EOF' > fpk_package/manifest.json
          {
            "id": "china-textbook-study",
            "name": "中国教材学习平台",
            "version": "${{ github.ref_name }}",
            "developer": "wuwangzhang1216",
            "description": "中小学电子教材与配套音资源学习平台",
            "arch": ["amd64", "arm64"],
            "icon": "icon.png",
            "main_port": 8080,
            "protocol": "http",
            "index_path": "/",
            "docker": {
              "compose_file": "docker-compose.yml"
            }
          }
          EOF

          # 创建 docker-compose.yml
          cat << 'EOF' > fpk_package/docker-compose.yml
          version: '3.8'
          services:
            web:
              image: nginx:alpine
              container_name: china-textbook-study
              restart: unless-stopped
              ports:
                - "${PORT:-8080}:80"
              volumes:
                - ./:/usr/share/nginx/html
          EOF

          # 复制图标
          if [ -f "apps/web/public/favicon.ico" ]; then
            cp apps/web/public/favicon.ico fpk_package/icon.png
          elif [ -f "public/favicon.ico" ]; then
            cp public/favicon.ico fpk_package/icon.png
          else
            touch fpk_package/icon.png
          fi

      # 7. 压缩为 .fpk 安装包
      - name: Compress to .fpk
        run: |
          cd fpk_package
          tar -czvf ../china-textbook-study_${{ github.ref_name }}.fpk .

      # 8. 发布到 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: china-textbook-study_*.fpk
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
